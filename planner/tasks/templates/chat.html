<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0;
            padding: clamp(16px, 5vw, 48px);
            font-family: Arial, sans-serif;
            background: #f8f9fa;
        }
        .chat {
            width: min(100%, 760px);
            margin: 0 auto;
            background: #fff;
            padding: clamp(18px, 4vw, 32px);
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, .1);
        }
        #messages {
            min-height: 240px;
            max-height: 55vh;
            overflow-y: auto;
            padding: 12px;
            margin-bottom: 16px;
            border: 1px solid #dee2e6;
            border-radius: 6px;
        }
        .chat-form { display: flex; gap: 8px; }
        #userInput { min-width: 0; flex: 1; padding: 10px; }
        .chat-form button { padding: 10px 18px; }
        @media (max-width: 480px) {
            .chat-form { flex-direction: column; }
            .chat-form button { width: 100%; }
        }
    </style>
</head>
<body>
    <main class="chat">
        <h1>AI Chat</h1>
        <div id="messages"></div>
        <div class="chat-form">
            <input type="text" id="userInput" placeholder="Type your message...">
            <button onclick="sendMessage()">Send</button>
        </div>
    </main>

    <script>
        async function sendMessage(){
            <!-- Get user input -->
            let input = document.getElementById('userInput').value;
            let response = await fetch("{% url 'ai_chat' %}", {
                method: "POST",
                

    
                headers: {
                    "Content-Type": "application/json",
                    "X-CSRFToken": "{{ csrf_token }}"
                },
                body: JSON.stringify({message: input})
            });

                let data = await response.json();
                document.getElementById('messages').innerHTML += "<p><strong>You:</strong> " + input + 
                    "</p>"+ "<p><strong>AI:</strong> " + data.response + "</p>";
            }
        
    </script>
</body>
</html>
