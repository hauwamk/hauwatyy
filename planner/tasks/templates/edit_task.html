<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        *{
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: Arial, sans-serif;
            background-color: #f8f9fa;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        .container{
            width: 100%;
            max-width: 500px;
            background-color: #fff;
            padding: 20px;
            border-radius: 5px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);

        }
        h3{
            text-align: center;
            margin-bottom: 20px;
        }
        input{
            width: 100%;
            padding: 12px;
            border-radius: 10px;
            border:1px solid #4facfe;
            
        }
        button{
            width: 100%;
            padding: 12px;
            border-radius: 10px;
            border:1px solid #4facfe;
            background-color: #4facfe;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }
        button:hover{
            background-color: #00f2fe;
        }
    </style>
</head>
<body>
    <div class="container">
        <h3>Edit Task</h3>
        <form method="post">
            {% csrf_token %}
            <label for="name">Task Name:</label>
            <input type="text" id="name" name="name" value="{{ task.name }}"><br><br>
            <label for="time">Time:</label>
            <input type="text" id="time" name="time" value="{{ task.time }}"><br><br>
            <label for="due_date">Due Date:</label>
            <input type="text" id="due_date" name="due_date" value="{{ task.due_date|date:'Y-m-d' }}"><br><br>
            <button type="submit">update task</button>
        </form>
    </div>
</body>
</html>
